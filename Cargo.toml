[package]
name = "process-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
humantime = "2.4.0"
humantime-serde = "1.1.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Small, fast release binaries (they run on a Raspberry Pi).
[profile.release]
strip = true
lto = true
codegen-units = 1
